<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="知美 AI 客服副驾比赛级可运行原型" />
    <title>知美 AI 客服副驾</title>
    <link rel="stylesheet" href="styles.css?v=polish-20261001-1" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">知</div>
          <div>
            <h1>知美 AI 客服副驾</h1>
            <p>消费者处境理解与服务闭环</p>
          </div>
        </div>
        <div class="topbar-center" aria-label="当前工作区">
          <span class="topbar-section active">单页接待工作台</span>
        </div>
        <div class="topbar-status">
          <span class="environment-badge">MOCK DATA</span>
          <span class="mode-badge">规则兜底 + DeepSeek</span>
          <span id="clock" class="clock"></span>
        </div>
      </header>

      <main class="workspace">
        <aside class="session-panel" aria-label="消费者会话列表">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">客户接待</span>
              <h2>接待队列</h2>
              <p>按风险和时间处理当前会话</p>
            </div>
            <span id="session-count" class="count-badge">0</span>
          </div>
          <div id="queue-summary" class="queue-summary" aria-label="队列风险概况"></div>
          <div class="session-controls">
            <label class="search-box">
              <span class="sr-only">搜索会话</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
              <input id="session-search" type="search" placeholder="搜索会话、场景或消息" />
            </label>
            <select id="scene-filter" aria-label="按场景筛选">
              <option value="">全部场景</option>
            </select>
          </div>
          <div id="session-list" class="session-list"></div>
        </aside>

        <section class="conversation-panel" aria-label="客服聊天工作区">
          <div id="conversation-header" class="conversation-header"></div>
          <div id="order-strip" class="order-strip"></div>
          <div id="conversation-context" class="conversation-context"></div>
          <div id="message-list" class="message-list" aria-live="polite"></div>
          <div class="composer">
            <div class="composer-toolbar">
              <span>人工回复</span>
              <span id="draft-source" class="draft-source">等待客服输入</span>
            </div>
            <textarea id="reply-input" rows="3" placeholder="请输入回复内容。AI 草稿不会自动发送。"></textarea>
            <div class="composer-actions">
              <button id="clear-reply" class="button secondary" type="button">清空</button>
              <button id="simulate-send" class="button primary" type="button">模拟发送</button>
            </div>
          </div>
        </section>

        <aside class="copilot-panel" aria-label="知美 AI 客服副驾插件">
          <div class="copilot-heading">
            <div class="copilot-brand-line">
              <span class="copilot-mark" aria-hidden="true">知</span>
              <div>
                <h2>知美副驾</h2>
                <p id="copilot-session">当前会话</p>
              </div>
            </div>
            <button id="analysis-state" class="analysis-state" type="button" title="配置或检查AI连接"><span></span><b>本地规则</b></button>
          </div>
          <div id="copilot-content" class="copilot-content"></div>
        </aside>
      </main>
    </div>

    <div id="case-modal" class="modal-overlay" hidden>
      <section class="case-modal" role="dialog" aria-modal="true" aria-labelledby="case-modal-title">
        <div class="modal-heading">
          <div><span class="eyebrow">AI 经验摘要</span><h2 id="case-modal-title">相似案例</h2></div>
          <button id="close-case-modal" class="modal-close" type="button" aria-label="关闭">×</button>
        </div>
        <div id="case-modal-content" class="modal-content"></div>
      </section>
    </div>
    <div id="ai-config-modal" class="modal-overlay" hidden>
      <section class="case-modal ai-config-dialog" role="dialog" aria-modal="true" aria-labelledby="ai-config-title">
        <div class="modal-heading">
          <div><span class="eyebrow">MODEL CONNECTION</span><h2 id="ai-config-title">真实AI连接</h2></div>
          <button id="close-ai-config" class="modal-close" type="button" aria-label="关闭">×</button>
        </div>
        <div class="modal-content">
          <label class="config-field" for="api-base-url"><span>AI后端地址</span><input id="api-base-url" type="url" placeholder="https://你的后端域名" /></label>
          <p class="config-note">这里只填写你自己的后端地址，不填写 DeepSeek 或 OpenAI API Key。密钥必须保存在后端环境变量中。</p>
          <div id="ai-config-result" class="connection-result">尚未检测连接</div>
          <div class="modal-actions"><button id="test-ai-connection" class="button secondary" type="button">测试连接</button><button id="save-ai-config" class="button primary" type="button">保存并启用</button></div>
        </div>
      </section>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script src="data.js"></script>
    <script src="core.js?v=experience-20261001-2"></script>
    <script src="config.js"></script>
    <script src="ai-client.js"></script>
    <script src="experience-core.js?v=experience-20261001-2"></script>
    <script src="app.js?v=polish-20261001-1"></script>
  </body>
</html>
